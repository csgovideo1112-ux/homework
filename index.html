<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Группа 4992</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/sf-ui-text-regular.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/sf-ui-display-heavy.woff2">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tasksView">
  <header>
    <div><h1>Задания</h1><p class="sub">Группа 4992</p></div>
    <button id="plusBtn" class="plus" hidden aria-label="Добавить">+</button>
  </header>
  <section class="hero" id="hero">
    <div class="hero-wm">4992</div>
    <div class="hero-top">
      <div class="hero-num" id="heroNum"></div>
      <div><div class="hero-dow" id="heroDow"></div><div class="hero-month" id="heroMonth"></div></div>
    </div>
    <div class="chips" id="heroChips"></div>
    <div class="next" id="heroNext"></div>
  </section>
  <section id="admin" class="panel" hidden>
    <input id="subject" placeholder="Предмет" autocomplete="off">
    <input id="task" placeholder="Задание" autocomplete="off">
    <input id="due" type="date">
    <button id="addBtn" class="primary">Добавить</button>
    <button id="tokenBtn" class="link">Ввести токен GitHub</button>
  </section>
  <div class="seg" id="viewSeg">
    <button data-view="active">Актуальные</button>
    <button data-view="archive">Архив</button>
  </div>
  <div class="seg small" id="sortSeg">
    <button data-sort="date">По сроку</button>
    <button data-sort="subject">По предметам</button>
  </div>
  <main id="list">Загрузка…</main>
</div>

<div id="schedView" hidden>
  <header><div><h1>Расписание</h1><p class="sub" id="weekInfo"></p></div></header>
  <div class="seg" id="weekSeg">
    <button data-week="upper">Верхняя неделя</button>
    <button data-week="lower">Нижняя неделя</button>
  </div>
  <div class="seg small" id="daySeg"></div>
  <div id="schedList"></div>
</div>

<div id="calView" hidden>
  <header>
    <div><h1 id="calTitle">Календарь</h1><p class="sub">Сроки сдачи и пары</p></div>
    <div class="nav"><button id="calPrev">‹</button><button id="calNext">›</button></div>
  </header>
  <div class="panel cal">
    <div class="wd"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div id="calGrid" class="grid"></div>
  </div>
  <div id="calDetail"></div>
</div>

<nav id="tabbar">
  <button data-tab="tasks"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>Задания</button>
  <button data-tab="sched"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Расписание</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Календарь</button>
</nav>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
