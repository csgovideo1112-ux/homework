<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Группа 4992</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>Задания</h1>
    <p class="sub">Группа 4992</p>
  </div>
  <button id="plusBtn" class="plus" hidden aria-label="Добавить">+</button>
</header>

<section id="admin" class="panel" hidden>
  <input id="subject" placeholder="Предмет" autocomplete="off">
  <input id="task" placeholder="Задание" autocomplete="off">
  <input id="due" type="date">
  <button id="addBtn" class="primary">Добавить</button>
  <button id="tokenBtn" class="link">Ввести токен GitHub</button>
</section>

<div class="seg" id="viewSeg">
  <button data-view="active">Актуальные</button>
  <button data-view="archive">Архив</button>
</div>
<div class="seg small" id="sortSeg">
  <button data-sort="date">По сроку</button>
  <button data-sort="subject">По предметам</button>
</div>

<main id="list">Загрузка…</main>

<script src="app.js"></script>
</body>
</html>
